<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Трекер воды</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>💧 Водный баланс</h1>

        <!-- Блок настройки -->
        <div class="card">
            <label>Ваш вес (кг): <input type="number" id="weight" value="70"></label>
            <button id="calcBtn">Рассчитать норму</button>
            <p id="normDisplay">Норма: -- мл</p>
        </div>

        <!-- Прогресс -->
        <div class="card">
            <div class="progress-circle">
                <span id="progressText">0 / 2000 мл</span>
            </div>
            <div class="progress-bar">
                <div id="progressFill" style="width: 0%"></div>
            </div>
        </div>

        <!-- Быстрый ввод -->
        <div class="card">
            <p>Быстрый ввод:</p>
            <button class="water-btn" data-amount="200">+200 мл</button>
            <button class="water-btn" data-amount="250">+250 мл</button>
            <button class="water-btn" data-amount="500">+500 мл</button>
            <button id="resetBtn" class="reset">Сбросить день</button>
        </div>

        <!-- Напоминания -->
        <div class="card">
            <button id="notifyBtn">Включить напоминания</button>
            <p id="notifyStatus">Напоминания выключены</p>
        </div>
    </div>
    <script src="script.js"></script>
</body>
</html>
